<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhenyu's Blog | Focus on Computer Science</title>
  <!-- 引入Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome（图标库） -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- Tailwind 自定义配置（Codeforces风格配色） -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cf: {
              blue: '#1A73E8',   // Codeforces主色调（蓝色）
              light: '#F5F5F5',  // 浅灰 hover 背景
              dark: '#202124',   // 深色文字
            },
          },
          fontFamily: {
            roboto: ['Roboto', 'sans-serif'], // 接近Codeforces的无衬线字体
          },
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .cf-table-row {
        @apply border-b border-gray-200 hover:bg-cf-light transition-colors duration-200;
      }
      .cf-link {
        @apply text-cf-blue hover:underline;
      }
    }
  </style>
  
  <!-- 引入Roboto字体（Codeforces类似字体） -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>

<body class="bg-white text-cf-dark">
  <!-- 顶部导航栏（模仿Codeforces导航） -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="container mx-auto px-4 py-2 flex items-center justify-between">
      <div class="flex items-center">
        <a href="#" class="text-2xl font-bold text-cf-blue flex items-center">
          <span class="mr-2"><i class="fa fa-code"></i></span>
          Zhenyu's Blog
        </a>
      </div>
      <div class="hidden md:flex space-x-6">
        <a href="index.html" class="cf-link font-medium">首页</a>
        <a href="classify.html" class="cf-link font-medium">分类</a>
        <a href="newest.html" class="cf-link font-medium">最新文章</a>
      </div>
      <div class="md:hidden">
        <button class="text-gray-500 hover:text-cf-blue">
          <i class="fa fa-bars text-xl"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="container mx-auto px-4 py-8">
    <!-- 介绍部分 -->
    <section class="mb-10 max-w-3xl">
      <h1 class="text-3xl font-bold mb-4">欢迎来到我的技术博客</h1>
      <p class="text-gray-600 text-lg">
        本页面为发布内容分类总结，包括计算机基础学习、算法与数据结构、项目杂谈等。设置目的是方便访客根据兴趣快速找到相关内容。
      </p>
    </section>

    <!-- 文章选择区域（模仿Codeforces题目列表） -->
    <section class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="bg-gray-100">
            <th class="px-4 py-3 text-left font-medium">分类</th>
            <th class="px-4 py-3 text-left font-medium">更新日期</th>
          </tr>
        </thead>
        <tbody>
          <!-- 分类1 -->
          <tr class="cf-table-row">
            <td class="px-4 py-4">
              <a href="post_dp.html" class="cf-link font-medium">计算机基础学习</a>
            </td>
            <td class="px-4 py-4 text-gray-600"> 2025-10-6 </td>
          </tr>

          <tr class="cf-table-row">
            <td class="px-4 py-4">
              <a href="post_dp.html" class="cf-link font-medium">算法与数据结构</a>
            </td>
            <td class="px-4 py-4 text-gray-600"> 2025-10-6 </td>
          </tr>

          <tr class="cf-table-row">
            <td class="px-4 py-4">
              <a href="post_dp.html" class="cf-link font-medium">项目杂谈</a>
            </td>
            <td class="px-4 py-4 text-gray-600"> 2025-10-6 </td>
          </tr>

        </tbody>
      </table>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="bg-gray-100 border-t border-gray-200 mt-12 py-6">
    <div class="container mx-auto px-4 text-center text-gray-600">
      <p>© 2025 Zhenyu's Blog</p>
    </div>
  </footer>
</body>
</html>
