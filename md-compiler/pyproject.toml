[project]
name = "md-compiler"
version = "0.1.0"
description = "A Markdown compiler tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "markdown>=3.5",
    "pygments>=2.16",
    "click>=8.1",
    "watchdog>=3.0",
]

[project.scripts]
md-compile = "md_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "2024-12-31T00:00:00Z"