<h1 id="_1">曼哈顿距离</h1>
<ol>
<li>求曼哈顿距离最大值<br />
将坐标轴顺时针旋转45°，扩大$\sqrt{2}$倍转化为切比雪夫距离。这样的话只需要计算最大的坐标轴差值。</li>
</ol>
<p>坐标变换：</p>
<div class="codehilite"><pre><span></span><code><span class="k">for</span> <span class="n">x</span><span class="p">,</span><span class="n">y</span> <span class="ow">in</span> <span class="n">points</span><span class="p">:</span>
    <span class="n">xs</span><span class="o">.</span><span class="n">add</span><span class="p">(</span><span class="n">x</span><span class="o">+</span><span class="n">y</span><span class="p">)</span>
    <span class="n">ys</span><span class="o">.</span><span class="n">add</span><span class="p">(</span><span class="o">-</span><span class="n">x</span><span class="o">+</span><span class="n">y</span><span class="p">)</span>
</code></pre></div>
