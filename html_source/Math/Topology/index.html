<h2>几何与拓扑</h2>

<p>首先主要学习：基础拓扑学、代数拓扑，图论学到后面平面图的时候就和基础的点集拓扑产生了联系，基础拓扑学也是学习实分析、范畴论的基础。</p>
<p>拓扑学参考书目：<br />
Mark Anthony Armstrong - Basic Topology<br />
Allen Hatcher - Algebraic Topology</p>
<p>然后学习微分几何、黎曼几何，之前在做项目的时候接触过流形的概念，不过等先学完基础拓扑再说。</p>
